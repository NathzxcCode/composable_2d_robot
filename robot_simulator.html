<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }
        .container { display: flex; height: 100vh; }
        .canvas-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #16213e;
            min-width: 400px;
        }
        header {
            padding: 16px 24px;
            background: #0f0f23;
            border-bottom: 1px solid #2a2a4a;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; color: #fff; }
        #simulation-canvas { flex: 1; cursor: grab; }
        #simulation-canvas:active { cursor: grabbing; }
        .panel {
            width: 320px;
            background: #0f0f23;
            border-left: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header { padding: 16px; border-bottom: 1px solid #2a2a4a; }
        .add-btn {
            width: 100%;
            padding: 12px;
            background: #4a90d9;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover { background: #3a7bc8; }
        .playback-controls {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
            align-items: center;
        }
        .playback-controls button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .playback-controls button.play-btn {
            background: #4a9a6a;
            color: #fff;
        }
        .playback-controls button.play-btn:hover { background: #3a8a5a; }
        .playback-controls button.pause-btn {
            background: #d94a4a;
            color: #fff;
        }
        .playback-controls button.pause-btn:hover { background: #c83a3a; }
        .playback-controls button:disabled {
            background: #3a3a5a;
            color: #666;
            cursor: not-allowed;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        .speed-control label {
            font-size: 0.75rem;
            color: #888;
        }
        .speed-control input[type="range"] {
            width: 80px;
        }
        .speed-value {
            font-size: 0.75rem;
            color: #aaa;
            min-width: 35px;
        }
        .panel-title {
            padding: 12px 16px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
        }
        .robot-list { flex: 1; overflow-y: auto; padding: 12px; }
        .robot-card {
            background: #1a1a2e;
            border: 2px solid transparent;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .robot-card:hover { border-color: #3a3a5a; }
        .robot-card.selected { border-color: #4a90d9; }
        .robot-card.connected { border-color: #4a9a6a; }
        .robot-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #16213e;
            user-select: none;
            cursor: pointer;
        }
        .robot-card-header:hover { background: #1e2a4a; }
        .robot-info { display: flex; align-items: center; gap: 10px; }
        .layer-indicator { width: 10px; height: 10px; border-radius: 50%; background: #4a90d9; }
        .layer-indicator.root { background: #8aba6a; }
        .layer-indicator.connected { background: #6aba8a; }
        .robot-name { font-weight: 500; font-size: 0.9rem; }
        .robot-card-actions { display: flex; gap: 4px; align-items: center; }
        .robot-card-actions button {
            padding: 4px 8px;
            background: #2a2a4a;
            border: none;
            border-radius: 4px;
            color: #aaa;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .robot-card-actions button:hover { background: #3a3a5a; color: #fff; }
        .robot-card-actions .delete:hover { background: #d94a4a; color: #fff; }
        .robot-card-body { padding: 12px; border-top: 1px solid #2a2a4a; background: #1a1a2e; }
        .control-group { margin-bottom: 12px; }
        .control-group:last-child { margin-bottom: 0; }
        .control-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 8px;
        }
        .angle-value { color: #4a90d9; font-weight: 600; font-size: 0.9rem; }
        .slider-container { position: relative; padding: 8px 0; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #2a2a4a;
            border-radius: 4px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #4a90d9;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        .connection-status {
            font-size: 0.75rem;
            color: #6aba8a;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #2a2a4a;
        }
        .connection-status.disconnected { color: #aa6a5a; }
        .hint {
            padding: 12px;
            font-size: 0.75rem;
            color: #666;
            text-align: center;
            border-top: 1px solid #2a2a4a;
        }
        .empty-state { text-align: center; padding: 40px 20px; color: #666; }
        .empty-state p { margin-bottom: 12px; }

        /* Server status badge */
        #server-status {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            background: #2a2a4a;
            color: #888;
            margin-left: 8px;
            vertical-align: middle;
        }
        #server-status.connected { background: #1a3a2a; color: #6aba8a; }
        #server-status.error     { background: #3a1a1a; color: #d96a6a; }

        .factor-graph-panel {
            width: 300px;
            background: #0f0f23;
            border-left: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .factor-graph-header {
            padding: 12px 16px;
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .factor-graph-header h3 {
            font-size: 0.85rem;
            color: #888;
            font-weight: 500;
        }
        .factor-graph-controls {
            display: flex;
            gap: 8px;
        }
        .factor-graph-controls button {
            padding: 4px 10px;
            background: #2a2a4a;
            border: none;
            border-radius: 4px;
            color: #aaa;
            font-size: 0.7rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .factor-graph-controls button:hover {
            background: #3a3a5a;
            color: #fff;
        }
        #factor-graph-canvas {
            flex: 1;
            cursor: grab;
        }
        #factor-graph-canvas:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="canvas-container">
            <header>
                <h1>Robot Simulator <span id="server-status">offline</span></h1>
            </header>
            <canvas id="simulation-canvas"></canvas>
        </div>
        <div class="panel">
            <div class="panel-header">
                <button class="add-btn" id="add-robot-btn">+ Add Robot</button>
            </div>
            <div class="playback-controls">
                <button class="play-btn" id="play-btn">Play</button>
                <button class="pause-btn" id="pause-btn" disabled>Pause</button>
                <div class="speed-control">
                    <label>Speed:</label>
                    <input type="range" id="speed-slider" min="1" max="20" value="5">
                    <span class="speed-value" id="speed-value">5</span>
                </div>
            </div>
            <div class="panel-title">Robot Chain</div>
            <div class="robot-list" id="robot-list">
                <div class="empty-state">
                    <p>No robots added yet</p>
                    <p style="font-size: 0.7rem;">Click the button above to add your first robot</p>
                </div>
            </div>
            <div class="hint">
                Drag a robot onto another robot to connect them
            </div>
        </div>
        <div class="factor-graph-panel">
            <div class="factor-graph-header">
                <h3>Factor Graph</h3>
                <div class="factor-graph-controls">
                    <button id="reset-view-btn" title="Reset view">Reset</button>
                    <button id="zoom-in-btn" title="Zoom in">+</button>
                    <button id="zoom-out-btn" title="Zoom out">-</button>
                </div>
            </div>
            <canvas id="factor-graph-canvas"></canvas>
        </div>
    </div>

    <script>
        // =====================================================================
        // Robot domain model
        // =====================================================================
        class Robot {
            constructor(id, x, y) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.angle = 0;
                this.limbLength = 140;
                this.limbWidth = 60;
                this.motorRadius = 20;
                this.sensorOffset = 120;
                this.connectedTo = null;
                this.connectionOffset = { x: 0, y: 0 };
            }

            getWorldPosition() {
                if (this.connectedTo) {
                    const parentPos = this.connectedTo.getWorldPosition();
                    const parentAngle = this.connectedTo.getWorldAngle();
                    const parentAngleRad = (parentAngle * Math.PI) / 180;
                    return {
                        x: parentPos.x + this.connectionOffset.x * Math.cos(parentAngleRad) - this.connectionOffset.y * Math.sin(parentAngleRad),
                        y: parentPos.y + this.connectionOffset.x * Math.sin(parentAngleRad) + this.connectionOffset.y * Math.cos(parentAngleRad)
                    };
                }
                return { x: this.x, y: this.y };
            }

            getWorldAngle() {
                if (this.connectedTo) {
                    return this.connectedTo.getWorldAngle() + this.angle;
                }
                return this.angle;
            }

            getDepth() {
                let depth = 0;
                let current = this.connectedTo;
                while (current) {
                    depth++;
                    current = current.connectedTo;
                }
                return depth;
            }

            containsPoint(px, py) {
                const pos = this.getWorldPosition();
                const dist = Math.sqrt((px - pos.x) ** 2 + (py - pos.y) ** 2);
                return dist <= this.motorRadius + 15;
            }

            getLimbStart() {
                return this.getWorldPosition();
            }

            getLimbEnd() {
                const pos = this.getWorldPosition();
                const angle = this.getWorldAngle();
                const angleRad = (angle * Math.PI) / 180;
                return {
                    x: pos.x + Math.cos(angleRad) * this.limbLength,
                    y: pos.y + Math.sin(angleRad) * this.limbLength
                };
            }

            getSensorOffset() {
                return { x: this.sensorOffset, y: 0 };
            }

            getSensorPosition() {
                const pos = this.getWorldPosition();
                const angle = this.getWorldAngle();
                const angleRad = (angle * Math.PI) / 180;
                return {
                    x: pos.x + Math.cos(angleRad) * this.sensorOffset,
                    y: pos.y + Math.sin(angleRad) * this.sensorOffset
                };
            }

            render(ctx, isSelected, isHovered, isConnected) {
                const motorPos = this.getWorldPosition();
                const angle = this.getWorldAngle();
                const angleRad = (angle * Math.PI) / 180;

                if (isConnected) {
                    ctx.beginPath();
                    ctx.arc(motorPos.x, motorPos.y, this.motorRadius + 15, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(106, 186, 138, 0.2)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(106, 186, 138, 0.6)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                ctx.save();
                ctx.translate(motorPos.x, motorPos.y);
                ctx.rotate(angleRad);

                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(this.limbLength, 0);
                ctx.strokeStyle = isSelected ? '#4a90d9' : isHovered ? '#3a6090' : '#2a4a6a';
                ctx.lineWidth = this.limbWidth;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.strokeStyle = isSelected ? '#6ab0ff' : '#4a7aa0';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, -this.limbWidth / 2, this.limbLength, this.limbWidth);

                ctx.restore();

                ctx.beginPath();
                ctx.arc(motorPos.x, motorPos.y, this.motorRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#1a2a3a';
                ctx.fill();
                ctx.strokeStyle = '#5a8ab0';
                ctx.lineWidth = 2;
                ctx.stroke();

                const indicatorAngleRad = (this.angle * Math.PI) / 180;
                ctx.beginPath();
                ctx.moveTo(motorPos.x, motorPos.y);
                ctx.lineTo(
                    motorPos.x + Math.cos(indicatorAngleRad) * this.motorRadius * 0.7,
                    motorPos.y + Math.sin(indicatorAngleRad) * this.motorRadius * 0.7
                );
                ctx.strokeStyle = '#ff6b6b';
                ctx.lineWidth = 4;
                ctx.stroke();

                if (isSelected) {
                    ctx.beginPath();
                    ctx.arc(motorPos.x, motorPos.y, this.motorRadius + 10, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(106, 176, 255, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                const limbEnd = this.getLimbEnd();
                ctx.beginPath();
                ctx.arc(limbEnd.x, limbEnd.y, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#3a5a7a';
                ctx.fill();
                ctx.strokeStyle = '#5a7a9a';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Sensor position dot
                const sensorPos = this.getSensorPosition();
                ctx.beginPath();
                ctx.arc(sensorPos.x, sensorPos.y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#8a4a9a';
                ctx.fill();
                ctx.strokeStyle = '#aa6aaa';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Dashed line from joint to sensor
                ctx.beginPath();
                ctx.setLineDash([4, 4]);
                ctx.moveTo(motorPos.x, motorPos.y);
                ctx.lineTo(sensorPos.x, sensorPos.y);
                ctx.strokeStyle = '#6a4a6a';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }

            findClosestPointOnBody(px, py) {
                const motorPos = this.getWorldPosition();
                const angle = this.getWorldAngle();
                const angleRad = (angle * Math.PI) / 180;

                const dx = px - motorPos.x;
                const dy = py - motorPos.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 1) return { x: 0, y: 0 };

                if (dist < this.motorRadius + 15) {
                    const dirX = dx / dist;
                    const dirY = dy / dist;
                    return { x: dirX * this.motorRadius, y: dirY * this.motorRadius };
                }

                const halfWidth = this.limbWidth / 2 + 25;
                const halfLength = this.limbLength;

                const rotatedDx = dx * Math.cos(-angleRad) - dy * Math.sin(-angleRad);
                const rotatedDy = dx * Math.sin(-angleRad) + dy * Math.cos(-angleRad);

                let localX, localY;

                if (Math.abs(rotatedDy) <= halfWidth && Math.abs(rotatedDx) <= halfLength + halfWidth) {
                    if (rotatedDx < 0 && Math.abs(rotatedDy) < halfWidth) {
                        localX = rotatedDx;
                        localY = rotatedDy;
                    } else if (rotatedDx >= 0 && rotatedDx <= halfLength && Math.abs(rotatedDy) <= halfWidth) {
                        localX = rotatedDx;
                        localY = Math.max(-halfWidth + 25, Math.min(halfWidth - 25, rotatedDy));
                    } else if (rotatedDx > halfLength) {
                        const cornerDist = Math.sqrt((rotatedDx - halfLength) ** 2 + rotatedDy ** 2);
                        if (cornerDist > halfWidth) {
                            const ang = Math.atan2(rotatedDy, rotatedDx - halfLength);
                            localX = halfLength + Math.cos(ang) * halfWidth;
                            localY = Math.sin(ang) * halfWidth;
                        } else {
                            localX = halfLength;
                            localY = rotatedDy;
                        }
                    } else {
                        localX = 0;
                        localY = Math.max(-halfWidth + 25, Math.min(halfWidth - 25, rotatedDy));
                    }
                } else {
                    if (rotatedDx <= 0) {
                        localX = rotatedDx;
                        localY = Math.sign(rotatedDy) * halfWidth;
                    } else {
                        localX = Math.min(rotatedDx, halfLength);
                        localY = Math.sign(rotatedDy) * halfWidth;
                    }
                }

                const worldX = motorPos.x + localX * Math.cos(angleRad) - localY * Math.sin(angleRad);
                const worldY = motorPos.y + localX * Math.sin(angleRad) + localY * Math.cos(angleRad);

                return { x: worldX - motorPos.x, y: worldY - motorPos.y };
            }
        }

        // =====================================================================
        // Force-directed factor graph visualisation
        // =====================================================================
        class GraphNode {
            constructor(robot) {
                this.id = robot.id;
                this.robot = robot;
                this.x = Math.random() * 200 + 50;
                this.y = Math.random() * 200 + 50;
                this.vx = 0;
                this.vy = 0;
            }

            get angle() {
                return this.robot.angle;
            }
        }

        class GraphFactor {
            constructor(nodeA, nodeB) {
                this.id = `${Math.min(nodeA.id, nodeB.id)}-${Math.max(nodeA.id, nodeB.id)}`;
                this.nodeA = nodeA;
                this.nodeB = nodeB;
            }
        }

        class ForceDirectedGraph {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.nodes = [];
                this.factors = [];
                this.zoom = 1;
                this.offsetX = 0;
                this.offsetY = 0;
                this.dragging = false;
                this.dragStart = { x: 0, y: 0 };
                this.dragNode = null;
                this.damping = 0.85;
                this.springLength = 80;
                this.springStrength = 0.05;
                this.repulsionStrength = 5000;
                this.centerStrength = 0.02;

                // Calibration panel data – set externally before each render()
                this.calibPanelRobots        = [];
                this.calibPanelCalibrations  = null;

                this.setupInteraction();
            }

            setupInteraction() {
                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.onMouseUp());
                this.canvas.addEventListener('mouseleave', () => this.onMouseUp());
                this.canvas.addEventListener('wheel', (e) => this.onWheel(e));
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            screenToWorld(sx, sy) {
                return {
                    x: (sx - this.offsetX) / this.zoom,
                    y: (sy - this.offsetY) / this.zoom
                };
            }

            onMouseDown(e) {
                const pos = this.getMousePos(e);
                const worldPos = this.screenToWorld(pos.x, pos.y);

                for (const node of this.nodes) {
                    const dist = Math.sqrt((worldPos.x - node.x) ** 2 + (worldPos.y - node.y) ** 2);
                    if (dist < 25) {
                        this.dragNode = node;
                        this.dragging = true;
                        this.canvas.style.cursor = 'grabbing';
                        return;
                    }
                }

                this.dragging = true;
                this.dragStart = { x: pos.x - this.offsetX, y: pos.y - this.offsetY };
                this.canvas.style.cursor = 'grabbing';
            }

            onMouseMove(e) {
                const pos = this.getMousePos(e);

                if (this.dragNode) {
                    const worldPos = this.screenToWorld(pos.x, pos.y);
                    this.dragNode.x = worldPos.x;
                    this.dragNode.y = worldPos.y;
                    this.dragNode.vx = 0;
                    this.dragNode.vy = 0;
                } else if (this.dragging) {
                    this.offsetX = pos.x - this.dragStart.x;
                    this.offsetY = pos.y - this.dragStart.y;
                } else {
                    let hovering = false;
                    const worldPos = this.screenToWorld(pos.x, pos.y);
                    for (const node of this.nodes) {
                        const dist = Math.sqrt((worldPos.x - node.x) ** 2 + (worldPos.y - node.y) ** 2);
                        if (dist < 25) { hovering = true; break; }
                    }
                    this.canvas.style.cursor = hovering ? 'grab' : 'default';
                }
            }

            onMouseUp() {
                this.dragging = false;
                this.dragNode = null;
                this.canvas.style.cursor = 'default';
            }

            onWheel(e) {
                e.preventDefault();
                const pos = this.getMousePos(e);
                const worldBefore = this.screenToWorld(pos.x, pos.y);

                this.zoom = e.deltaY < 0
                    ? Math.min(3, this.zoom * 1.1)
                    : Math.max(0.3, this.zoom / 1.1);

                const worldAfter = this.screenToWorld(pos.x, pos.y);
                this.offsetX += (worldAfter.x - worldBefore.x) * this.zoom;
                this.offsetY += (worldAfter.y - worldBefore.y) * this.zoom;
            }

            updateFromRobots(robots) {
                const nodeMap = new Map();

                for (const robot of robots) {
                    let node = this.nodes.find(n => n.id === robot.id);
                    if (!node) {
                        node = new GraphNode(robot);
                        this.nodes.push(node);
                    } else {
                        node.robot = robot;
                    }
                    nodeMap.set(robot.id, node);
                }

                this.nodes = this.nodes.filter(n => robots.some(r => r.id === n.id));

                this.factors = [];
                for (const robot of robots) {
                    if (robot.connectedTo) {
                        const nodeA = nodeMap.get(robot.id);
                        const nodeB = nodeMap.get(robot.connectedTo.id);
                        if (nodeA && nodeB) {
                            const existing = this.factors.find(f =>
                                (f.nodeA === nodeA && f.nodeB === nodeB) ||
                                (f.nodeA === nodeB && f.nodeB === nodeA)
                            );
                            if (!existing) {
                                this.factors.push(new GraphFactor(nodeA, nodeB));
                            }
                        }
                    }
                }
            }

            step() {
                if (this.nodes.length === 0) return false;

                const maxVelocity = 50;
                const minDistance = 30;
                let hasMotion = false;

                for (const node of this.nodes) {
                    if (Math.abs(node.vx) > 0.1 || Math.abs(node.vy) > 0.1) hasMotion = true;

                    let fx = 0, fy = 0;

                    for (const other of this.nodes) {
                        if (other === node) continue;
                        const dx = node.x - other.x;
                        const dy = node.y - other.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDistance) dist = minDistance;
                        const force = this.repulsionStrength / (dist * dist);
                        fx += (dx / dist) * force;
                        fy += (dy / dist) * force;
                    }

                    for (const factor of this.factors) {
                        let other = null;
                        if (factor.nodeA === node) other = factor.nodeB;
                        else if (factor.nodeB === node) other = factor.nodeA;
                        else continue;

                        const dx = other.x - node.x;
                        const dy = other.y - node.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDistance) dist = minDistance;
                        const displacement = dist - this.springLength;
                        const force = this.springStrength * displacement;
                        fx += (dx / dist) * force;
                        fy += (dy / dist) * force;
                    }

                    const centerX = this.canvas.width / 2 / this.zoom;
                    const centerY = this.canvas.height / 2 / this.zoom;
                    fx += (centerX - node.x) * this.centerStrength;
                    fy += (centerY - node.y) * this.centerStrength;

                    node.vx = (node.vx + fx) * this.damping;
                    node.vy = (node.vy + fy) * this.damping;

                    node.vx = Math.max(-maxVelocity, Math.min(maxVelocity, node.vx));
                    node.vy = Math.max(-maxVelocity, Math.min(maxVelocity, node.vy));

                    if (node !== this.dragNode) {
                        node.x += node.vx;
                        node.y += node.vy;
                    }
                }

                if (!hasMotion) {
                    for (const node of this.nodes) {
                        if (Math.abs(node.vx) > 0.01 || Math.abs(node.vy) > 0.01) {
                            hasMotion = true;
                            break;
                        }
                    }
                }

                return hasMotion;
            }

            render() {
                const ctx = this.ctx;
                ctx.fillStyle = '#0f0f23';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                ctx.save();
                ctx.translate(this.offsetX, this.offsetY);
                ctx.scale(this.zoom, this.zoom);

                ctx.strokeStyle = '#1e2a4a';
                ctx.lineWidth = 1;
                const gridSize = 30;
                for (let x = 0; x < this.canvas.width / this.zoom; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, this.canvas.height / this.zoom);
                    ctx.stroke();
                }
                for (let y = 0; y < this.canvas.height / this.zoom; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(this.canvas.width / this.zoom, y);
                    ctx.stroke();
                }

                for (const factor of this.factors) {
                    ctx.beginPath();
                    ctx.moveTo(factor.nodeA.x, factor.nodeA.y);
                    ctx.lineTo(factor.nodeB.x, factor.nodeB.y);
                    ctx.strokeStyle = '#4a6a5a';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    const midX = (factor.nodeA.x + factor.nodeB.x) / 2;
                    const midY = (factor.nodeA.y + factor.nodeB.y) / 2;
                    ctx.fillStyle = '#4a8a6a';
                    ctx.fillRect(midX - 8, midY - 8, 16, 16);
                    ctx.strokeStyle = '#6aba8a';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(midX - 8, midY - 8, 16, 16);
                }

                for (const node of this.nodes) {
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 28, 0, Math.PI * 2);
                    ctx.fillStyle = '#2a4a6a';
                    ctx.fill();
                    ctx.strokeStyle = '#4a90d9';
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 14px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(node.id.toString(), node.x, node.y - 10);

                    ctx.fillStyle = '#4a90d9';
                    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.fillText(`${Math.round(node.angle)}°`, node.x, node.y + 8);
                }

                ctx.restore();

                // Draw calibration info panel in canvas-space (unaffected by zoom/pan)
                this.drawCalibrationPanel();
            }

            /**
             * Draw a fixed calibration info panel at the bottom of the factor-graph canvas.
             * Always shows the true offset for every connection. Shows the GBP
             * estimated offset alongside once calibration data is available.
             * Drawn in raw canvas-space (not affected by zoom/pan).
             */
            drawCalibrationPanel() {
                const robots       = this.calibPanelRobots;
                const calibrations = this.calibPanelCalibrations;

                // Collect one entry per child robot that has a parent
                const connections = robots.filter(r => r.connectedTo);
                if (connections.length === 0) return;

                const ctx        = this.ctx;
                const lineHeight = 17;
                const padX       = 10;
                const panelRows  = connections.length * 3 + 1; // header + 3 rows per connection
                const panelH     = panelRows * lineHeight + 14;
                const panelY     = this.canvas.height - panelH - 6;
                const panelW     = this.canvas.width - padX * 2;

                // Panel background
                ctx.fillStyle = 'rgba(10, 10, 25, 0.82)';
                ctx.strokeStyle = '#2a2a4a';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(padX, panelY, panelW, panelH, 5);
                ctx.fill();
                ctx.stroke();

                let y = panelY + lineHeight;

                // Section header
                ctx.fillStyle = '#555577';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText('CALIBRATION', padX + 6, y);
                y += lineHeight;

                for (const child of connections) {
                    const parent    = child.connectedTo;
                    const calibId   = 'calib' + child.id;
                    const calibData = calibrations
                        ? calibrations.find(c => c.id === calibId)
                        : null;

                    // True offset: connectionOffset is motor-relative;
                    // subtract limbLength to get endpoint-relative (solver convention)
                    const trueX = child.connectionOffset.x - parent.limbLength;
                    const trueY = child.connectionOffset.y;

                    // Row label: "limb N→M"
                    ctx.fillStyle = '#6688aa';
                    ctx.font = 'bold 10px monospace';
                    ctx.fillText(`limb ${parent.id} \u2192 ${child.id}`, padX + 6, y);
                    y += lineHeight;

                    // True row
                    ctx.fillStyle = '#00ff88';
                    ctx.font = '10px monospace';
                    ctx.fillText('TRUE', padX + 6, y);
                    ctx.fillStyle = '#ccddcc';
                    ctx.fillText(
                        `x: ${trueX >= 0 ? '+' : ''}${trueX.toFixed(1).padStart(6)}   y: ${trueY >= 0 ? '+' : ''}${trueY.toFixed(1).padStart(6)}`,
                        padX + 44, y
                    );
                    y += lineHeight;

                    // Estimated row
                    if (calibData) {
                        const [ex, ey] = calibData.mean;
                        ctx.fillStyle = '#00eeff';
                        ctx.font = '10px monospace';
                        ctx.fillText('EST ', padX + 6, y);
                        ctx.fillStyle = '#cceeff';
                        ctx.fillText(
                            `x: ${ex >= 0 ? '+' : ''}${ex.toFixed(1).padStart(6)}   y: ${ey >= 0 ? '+' : ''}${ey.toFixed(1).padStart(6)}`,
                            padX + 44, y
                        );
                    } else {
                        ctx.fillStyle = '#444466';
                        ctx.font = '10px monospace';
                        ctx.fillText('EST   x:      \u2014       y:      \u2014', padX + 6, y);
                    }
                    y += lineHeight + 2; // small gap between connections
                }
            }

            resetView() {
                this.zoom = 1;
                this.offsetX = 0;
                this.offsetY = 0;
            }
        }

        // =====================================================================
        // WebSocket client wrapper
        // =====================================================================
        class SolverWebSocket {
            constructor(url, onCalibration, onStatusChange) {
                this.url = url;
                this.onCalibration = onCalibration;   // callback(calibrationMsg)
                this.onStatusChange = onStatusChange; // callback('connected'|'disconnected'|'error')
                this.ws = null;
            }

            connect() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) return;

                this.ws = new WebSocket(this.url);

                this.ws.onopen = () => {
                    console.log('[WS] Connected to live GBP server');
                    this.onStatusChange('connected');
                };

                this.ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'calibration') {
                            this.onCalibration(msg);
                        } else if (msg.type === 'error') {
                            console.warn('[WS] Server error:', msg.message);
                        }
                    } catch (e) {
                        console.warn('[WS] Failed to parse message:', e);
                    }
                };

                this.ws.onerror = () => {
                    console.warn('[WS] WebSocket error');
                    this.onStatusChange('error');
                };

                this.ws.onclose = () => {
                    console.log('[WS] Disconnected');
                    this.onStatusChange('disconnected');
                    this.ws = null;
                };
            }

            send(msg) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(msg));
                    return true;
                }
                return false;
            }

            reset() {
                this.send({ type: 'reset' });
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }

            get isConnected() {
                return this.ws !== null && this.ws.readyState === WebSocket.OPEN;
            }
        }

        // =====================================================================
        // Calibration visualisation helpers
        // =====================================================================

        /**
         * Compute the 2D eigendecomposition of a symmetric 2x2 matrix.
         * Returns { angle, rx, ry } where:
         *   angle  – rotation of the major axis (radians)
         *   rx, ry – half-axes = sqrt(eigenvalue) * SCALE_FACTOR
         */
        const ELLIPSE_SCALE = 12;

        function eigenDecompose2x2(cov) {
            const a = cov[0][0], b = cov[0][1], d = cov[1][1];
            const trace  = a + d;
            const det    = a * d - b * b;
            const disc   = Math.sqrt(Math.max(0, (trace / 2) ** 2 - det));
            const lam1   = trace / 2 + disc;
            const lam2   = trace / 2 - disc;

            // Eigenvector for lam1
            let angle = 0;
            if (Math.abs(b) > 1e-10) {
                angle = Math.atan2(lam1 - a, b);
            } else {
                angle = a >= d ? 0 : Math.PI / 2;
            }

            return {
                angle,
                rx: Math.sqrt(Math.max(0, lam1)) * ELLIPSE_SCALE,
                ry: Math.sqrt(Math.max(0, lam2)) * ELLIPSE_SCALE
            };
        }

        /**
         * Rotate a local 2D offset [lx, ly] by worldAngle (radians) and add
         * to worldOrigin. Used to transform calibration/connection offsets from
         * the parent's local frame into world (canvas) coordinates.
         */
        function localToWorld(worldOrigin, worldAngleRad, lx, ly) {
            return {
                x: worldOrigin.x + lx * Math.cos(worldAngleRad) - ly * Math.sin(worldAngleRad),
                y: worldOrigin.y + lx * Math.sin(worldAngleRad) + ly * Math.cos(worldAngleRad)
            };
        }

        /**
         * Given a parent robot, compute the world-space position of a
         * calibration offset [cx, cy] (in the parent's local frame, relative
         * to the parent's endpoint / limb end).
         *
         * Convention matches KinematicCalibModel:
         *   T_pred = N_parent @ L_link @ C @ J
         * So the offset is applied AFTER walking the full limb length L along
         * the parent. In world space:
         *   connectionWorld = parentEndpoint + R(parentWorldAngle) * [cx, cy]
         */
        function calibOffsetToWorld(parentRobot, cx, cy) {
            const endpoint   = parentRobot.getLimbEnd();          // parent's limb endpoint in world
            const angleRad   = parentRobot.getWorldAngle() * Math.PI / 180;
            return localToWorld(endpoint, angleRad, cx, cy);
        }

        // =====================================================================
        // Main simulator
        // =====================================================================
        class RobotSimulator {
            constructor() {
                this.robots = [];
                this.selectedRobot = null;
                this.hoveredRobot = null;
                this.dragging = false;
                this.dragTarget = null;
                this.nextId = 1;

                this.isPlaying = false;
                this.playSpeed = 5;
                this.targetAngles = {};

                // Step-lock state machine
                // States: IDLE | MOVING | WAITING_FOR_SOLVER | POST_STEP_PAUSE
                this.stepState = 'IDLE';
                this.postStepPauseMs = 500;
                this.postStepTimer = null;

                // Calibration data received from the solver
                this.calibrationData = null;   // last msg.calibrations array

                this.canvas = document.getElementById('simulation-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.robotListEl = document.getElementById('robot-list');
                this.addBtn = document.getElementById('add-robot-btn');

                this.factorGraphCanvas = document.getElementById('factor-graph-canvas');
                this.factorGraph = new ForceDirectedGraph(this.factorGraphCanvas);

                // WebSocket solver connection
                this.solver = new SolverWebSocket(
                    'ws://localhost:8000/ws',
                    (msg) => this.onCalibrationReceived(msg),
                    (status) => this.onServerStatus(status)
                );

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
                this.canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
                this.canvas.addEventListener('mouseup', () => this.onMouseUp());
                this.canvas.addEventListener('mouseleave', () => this.onMouseUp());

                this.addBtn.addEventListener('click', () => this.addRobot());

                document.getElementById('reset-view-btn').addEventListener('click', () => {
                    this.factorGraph.resetView();
                });
                document.getElementById('zoom-in-btn').addEventListener('click', () => {
                    this.factorGraph.zoom = Math.min(3, this.factorGraph.zoom * 1.2);
                });
                document.getElementById('zoom-out-btn').addEventListener('click', () => {
                    this.factorGraph.zoom = Math.max(0.3, this.factorGraph.zoom / 1.2);
                });

                document.getElementById('play-btn').addEventListener('click', () => this.startPlayback());
                document.getElementById('pause-btn').addEventListener('click', () => this.stopPlayback());
                document.getElementById('speed-slider').addEventListener('input', (e) => {
                    this.playSpeed = parseInt(e.target.value);
                    document.getElementById('speed-value').textContent = this.playSpeed;
                });

                // Try to connect to the live server (non-blocking)
                this.solver.connect();

                this.render();
                this.animate();
            }

            // ------------------------------------------------------------------
            // Server callbacks
            // ------------------------------------------------------------------

            onServerStatus(status) {
                const badge = document.getElementById('server-status');
                badge.className = status;
                badge.textContent = status === 'connected' ? 'live GBP'
                                  : status === 'error'     ? 'error'
                                  : 'offline';
            }

            onCalibrationReceived(msg) {
                // msg = { type:"calibration", calibrations:[...], step:N, energy:E }
                this.calibrationData = msg.calibrations;
                console.log(`[GBP] step=${msg.step}, energy=${msg.energy?.toFixed(4)}`);

                // Advance the state machine: solver has responded
                if (this.stepState === 'WAITING_FOR_SOLVER') {
                    this.stepState = 'POST_STEP_PAUSE';
                    this.render();   // redraw with new calibration overlay

                    this.postStepTimer = setTimeout(() => {
                        if (this.isPlaying) {
                            this.pickNewTargets();
                            this.stepState = 'MOVING';
                        } else {
                            this.stepState = 'IDLE';
                        }
                    }, this.postStepPauseMs);
                }
            }

            // ------------------------------------------------------------------
            // Playback control
            // ------------------------------------------------------------------

            startPlayback() {
                if (this.robots.length === 0) return;

                this.isPlaying = true;
                document.getElementById('play-btn').disabled = true;
                document.getElementById('pause-btn').disabled = false;

                // Open / reset the solver session
                if (!this.solver.isConnected) {
                    this.solver.connect();
                    // Give WS a moment to open before we start sending
                    setTimeout(() => this._beginStep(), 300);
                } else {
                    this.solver.reset();          // fresh factor graph
                    this.calibrationData = null;  // clear old overlay
                    this._beginStep();
                }
            }

            _beginStep() {
                this.pickNewTargets();
                this.stepState = 'MOVING';
            }

            stopPlayback() {
                this.isPlaying = false;
                this.stepState = 'IDLE';
                if (this.postStepTimer) {
                    clearTimeout(this.postStepTimer);
                    this.postStepTimer = null;
                }
                document.getElementById('play-btn').disabled = false;
                document.getElementById('pause-btn').disabled = true;
            }

            pickNewTargets() {
                for (const robot of this.robots) {
                    this.targetAngles[robot.id] = Math.random() * 360;
                }
            }

            // ------------------------------------------------------------------
            // Build and send pose payload
            // ------------------------------------------------------------------

            buildPosePayload() {
                const baseLimb = this.robots.find(r => r.getDepth() === 0);
                const baseOrigin = baseLimb ? baseLimb.getWorldPosition() : { x: 0, y: 0 };

                const limbs = this.robots.map(r => {
                    const worldPos   = r.getWorldPosition();
                    const worldAngle = r.getWorldAngle();
                    const limbEnd    = r.getLimbEnd();

                    return {
                        id: r.id,
                        local_angle: r.angle,
                        global_angle: worldAngle,
                        position: {
                            x: worldPos.x - baseOrigin.x,
                            y: worldPos.y - baseOrigin.y
                        },
                        endpoint: {
                            x: limbEnd.x - baseOrigin.x,
                            y: limbEnd.y - baseOrigin.y
                        },
                        sensor_offset: { x: r.sensorOffset, y: 0 },
                        limb_length: r.limbLength,
                        depth: r.getDepth()
                    };
                });

                const connections = [];
                for (const robot of this.robots) {
                    if (robot.connectedTo) {
                        const sensorPos       = robot.getSensorPosition();
                        const parentSensorPos = robot.connectedTo.getSensorPosition();
                        const dx = parentSensorPos.x - sensorPos.x;
                        const dy = parentSensorPos.y - sensorPos.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        connections.push({
                            child_id:  robot.id,
                            parent_id: robot.connectedTo.id,
                            depth:     robot.getDepth(),
                            calibration: {
                                offset_x: robot.connectionOffset.x,
                                offset_y: robot.connectionOffset.y
                            },
                            distance
                        });
                    }
                }

                return { type: 'pose', limbs, connections };
            }

            sendPose() {
                const payload = this.buildPosePayload();
                const sent = this.solver.send(payload);
                if (!sent) {
                    // Server not connected – skip waiting, just keep moving
                    console.warn('[WS] Server not connected, skipping pose send');
                    this.stepState = 'POST_STEP_PAUSE';
                    this.postStepTimer = setTimeout(() => {
                        if (this.isPlaying) {
                            this.pickNewTargets();
                            this.stepState = 'MOVING';
                        } else {
                            this.stepState = 'IDLE';
                        }
                    }, this.postStepPauseMs);
                }
            }

            // ------------------------------------------------------------------
            // Animation loop
            // ------------------------------------------------------------------

            animate() {
                if (this.isPlaying && this.stepState === 'MOVING' && this.robots.length > 0) {
                    let allSettled = true;

                    for (const robot of this.robots) {
                        const targetAngle  = this.targetAngles[robot.id] ?? Math.random() * 360;
                        this.targetAngles[robot.id] = targetAngle;

                        let diff = targetAngle - robot.angle;
                        if (diff > 180)  diff -= 360;
                        if (diff < -180) diff += 360;

                        const step = this.playSpeed;
                        if (Math.abs(diff) > step) {
                            allSettled = false;
                            robot.angle += Math.sign(diff) * step;
                        } else {
                            robot.angle = targetAngle;
                        }

                        if (robot.angle < 0) robot.angle += 360;
                        robot.angle = robot.angle % 360;

                        const angleEl  = document.getElementById(`angle-${robot.id}`);
                        const sliderEl = document.getElementById(`slider-${robot.id}`);
                        if (angleEl)  angleEl.textContent  = `${Math.round(robot.angle)}deg`;
                        if (sliderEl) sliderEl.value       = robot.angle;
                    }

                    if (allSettled) {
                        // All joints at target – send pose to solver and wait
                        this.stepState = 'WAITING_FOR_SOLVER';
                        this.sendPose();
                    }

                    this.render();
                }

                // Update factor graph visualisation
                this.factorGraph.updateFromRobots(this.robots);
                // Pass current robots + calibration data so the panel can render
                this.factorGraph.calibPanelRobots       = this.robots;
                this.factorGraph.calibPanelCalibrations = this.calibrationData;
                if (this.factorGraph.nodes.length > 0) {
                    const hasMotion = this.factorGraph.step();
                    this.factorGraph.render();
                    if (hasMotion) {
                        requestAnimationFrame(() => this.animate());
                    } else {
                        setTimeout(() => this.animate(), 50);
                    }
                } else {
                    this.factorGraph.render();
                    requestAnimationFrame(() => this.animate());
                }
            }

            // ------------------------------------------------------------------
            // Calibration overlay rendering
            // ------------------------------------------------------------------

            /**
             * Draw the calibration estimates on the main canvas.
             *
             * For each calib node (e.g. "calib2"):
             *   - Green cross  = ground-truth connection point (true connectionOffset
             *                    from the parent's endpoint in world space)
             *   - Cyan dot     = GBP mean estimate (same coordinate convention)
             *   - Cyan ellipse = 2D positional uncertainty (eigendecomposed 2x2 cov)
             *
             * Coordinate convention for calib[x,y]:
             *   The calibration offset is in the parent limb's LOCAL frame,
             *   expressed relative to the parent's ENDPOINT (limb end).
             *   To get world space: rotate [cx, cy] by the parent's world angle
             *   and add the parent's endpoint world position.
             */
            drawCalibration(ctx) {
                if (!this.calibrationData) return;

                for (const calib of this.calibrationData) {
                    // calib.id is e.g. "calib2"  →  child robot id is 2
                    const childIdStr = calib.id.replace('calib', '');
                    const childId    = parseInt(childIdStr);
                    const childRobot = this.robots.find(r => r.id === childId);
                    if (!childRobot || !childRobot.connectedTo) continue;

                    const parentRobot = childRobot.connectedTo;

                    // ── Ground truth ───────────────────────────────────────────
                    // connectionOffset is in the parent's local frame but measured
                    // from the parent's MOTOR position. The calibration convention
                    // is from the parent's ENDPOINT, so we subtract the limb length
                    // along the local x-axis to get the endpoint-relative offset.
                    const trueOffsetFromEndpoint = {
                        x: childRobot.connectionOffset.x - parentRobot.limbLength,
                        y: childRobot.connectionOffset.y
                    };
                    const trueWorld = calibOffsetToWorld(
                        parentRobot,
                        trueOffsetFromEndpoint.x,
                        trueOffsetFromEndpoint.y
                    );

                    // Green cross + label for ground truth
                    const crossSize = 10;
                    ctx.save();
                    ctx.translate(trueWorld.x, trueWorld.y);
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth   = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-crossSize, 0); ctx.lineTo(crossSize, 0);
                    ctx.moveTo(0, -crossSize); ctx.lineTo(0, crossSize);
                    ctx.stroke();
                    ctx.fillStyle = '#00ff88';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('TRUE', crossSize + 3, -2);
                    ctx.restore();

                    // ── Solver estimate ────────────────────────────────────────
                    const [cx, cy] = calib.mean;
                    const estWorld  = calibOffsetToWorld(parentRobot, cx, cy);

                    // Cyan filled dot + label for mean estimate
                    ctx.beginPath();
                    ctx.arc(estWorld.x, estWorld.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = '#00eeff';
                    ctx.fill();
                    ctx.fillStyle = '#00eeff';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';
                    ctx.fillText('EST', estWorld.x + 8, estWorld.y + 2);

                    // ── Uncertainty ellipse ────────────────────────────────────
                    const { angle, rx, ry } = eigenDecompose2x2(calib.cov_xy);

                    // The ellipse axes are in the parent's local frame
                    // (same frame as the calibration mean). Rotate to world.
                    const parentAngleRad = parentRobot.getWorldAngle() * Math.PI / 180;
                    const totalAngle     = parentAngleRad + angle;

                    ctx.save();
                    ctx.translate(estWorld.x, estWorld.y);
                    ctx.rotate(totalAngle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, Math.max(rx, 1), Math.max(ry, 1), 0, 0, 2 * Math.PI);
                    ctx.strokeStyle = 'rgba(0, 238, 255, 0.7)';
                    ctx.lineWidth   = 1.5;
                    ctx.stroke();
                    // Light fill so the ellipse is visible without obscuring the robot
                    ctx.fillStyle = 'rgba(0, 238, 255, 0.08)';
                    ctx.fill();
                    ctx.restore();


                }
            }

            // ------------------------------------------------------------------
            // Render
            // ------------------------------------------------------------------

            render() {
                this.ctx.fillStyle = '#16213e';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                const gridSize = 30;
                this.ctx.strokeStyle = '#1e2a4a';
                this.ctx.lineWidth = 1;

                for (let x = 0; x < this.canvas.width; x += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }

                for (let y = 0; y < this.canvas.height; y += gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width, y);
                    this.ctx.stroke();
                }

                const sortedByDepth = [...this.robots].sort((a, b) => a.getDepth() - b.getDepth());

                sortedByDepth.forEach(robot => {
                    robot.render(
                        this.ctx,
                        robot === this.selectedRobot,
                        robot === this.hoveredRobot,
                        robot.connectedTo !== null
                    );
                });

                // Draw sensor-to-sensor distance lines
                for (const robot of this.robots) {
                    if (robot.connectedTo) {
                        const sensorPos       = robot.getSensorPosition();
                        const parentSensorPos = robot.connectedTo.getSensorPosition();
                        this.ctx.beginPath();
                        this.ctx.moveTo(parentSensorPos.x, parentSensorPos.y);
                        this.ctx.lineTo(sensorPos.x, sensorPos.y);
                        this.ctx.strokeStyle = 'rgba(138, 74, 154, 0.5)';
                        this.ctx.lineWidth   = 2;
                        this.ctx.setLineDash([6, 4]);
                        this.ctx.stroke();
                        this.ctx.setLineDash([]);
                    }
                }

                // Draw calibration overlay on top
                this.drawCalibration(this.ctx);
            }

            // ------------------------------------------------------------------
            // Mouse interaction
            // ------------------------------------------------------------------

            resize() {
                const container = this.canvas.parentElement;
                this.canvas.width  = container.clientWidth;
                this.canvas.height = container.clientHeight - 56;

                const graphContainer = this.factorGraphCanvas.parentElement;
                this.factorGraphCanvas.width  = graphContainer.clientWidth;
                this.factorGraphCanvas.height = graphContainer.clientHeight - 45;

                this.render();
            }

            getMousePos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            onMouseDown(e) {
                const pos   = this.getMousePos(e);
                const robot = this.findRobotAtPoint(pos.x, pos.y);

                if (robot) {
                    this.selectRobot(robot);
                    this.dragging   = true;
                    this.dragTarget = robot;

                    if (robot.connectedTo) {
                        robot.connectedTo = null;
                        robot.x = pos.x;
                        robot.y = pos.y;
                    }

                    this.canvas.style.cursor = 'grabbing';
                    this.updateRobotList();
                } else {
                    this.selectRobot(null);
                }
            }

            onMouseMove(e) {
                const pos = this.getMousePos(e);

                if (this.dragging && this.dragTarget) {
                    this.dragTarget.x = pos.x;
                    this.dragTarget.y = pos.y;
                    this.render();
                } else {
                    this.hoveredRobot          = this.findRobotAtPoint(pos.x, pos.y);
                    this.canvas.style.cursor   = this.hoveredRobot ? 'grab' : 'default';
                }
            }

            onMouseUp() {
                if (this.dragging && this.dragTarget) {
                    const robot = this.dragTarget;
                    const pos   = { x: robot.x, y: robot.y };
                    this.tryConnectToNearbyRobot(robot, pos.x, pos.y);
                    this.updateRobotList();
                    this.render();
                }
                this.dragging   = false;
                this.dragTarget = null;
                this.canvas.style.cursor = 'default';
            }

            findRobotAtPoint(px, py) {
                for (const robot of this.robots) {
                    if (robot.containsPoint(px, py)) return robot;
                }
                return null;
            }

            isDescendantOf(candidate, parent) {
                let current = candidate.connectedTo;
                while (current) {
                    if (current === parent) return true;
                    current = current.connectedTo;
                }
                return false;
            }

            tryConnectToNearbyRobot(robot, px, py) {
                if (robot.connectedTo) return;

                const candidates = [];

                for (const other of this.robots) {
                    if (other === robot) continue;
                    if (other.connectedTo === robot) continue;
                    if (this.isDescendantOf(other, robot)) continue;

                    const closest  = other.findClosestPointOnBody(px, py);
                    const otherPos = other.getWorldPosition();

                    const worldClosestX = otherPos.x + closest.x;
                    const worldClosestY = otherPos.y + closest.y;

                    const dist = Math.sqrt((px - worldClosestX) ** 2 + (py - worldClosestY) ** 2);

                    if (dist < 50) {
                        candidates.push({
                            robot: other,
                            dist,
                            closest,
                            depth: other.getDepth()
                        });
                    }
                }

                if (candidates.length === 0) return;

                candidates.sort((a, b) => b.depth - a.depth);

                const best            = candidates[0];
                const parentAngle     = best.robot.getWorldAngle();
                const parentAngleRad  = (parentAngle * Math.PI) / 180;

                const localX = best.closest.x * Math.cos(-parentAngleRad) - best.closest.y * Math.sin(-parentAngleRad);
                const localY = best.closest.x * Math.sin(-parentAngleRad) + best.closest.y * Math.cos(-parentAngleRad);

                robot.connectedTo     = best.robot;
                robot.connectionOffset = { x: localX, y: localY };
            }

            selectRobot(robot) {
                this.selectedRobot = robot;
                this.updateRobotList();
                this.render();
            }

            addRobot() {
                const x = this.canvas.width  / 2 + (Math.random() - 0.5) * 150;
                const y = this.canvas.height / 2 + (Math.random() - 0.5) * 150;

                const robot = new Robot(this.nextId++, x, y);
                this.robots.push(robot);
                this.selectRobot(robot);
                this.updateRobotList();
                this.render();
            }

            removeRobot(robot) {
                const index = this.robots.indexOf(robot);
                if (index > -1) this.robots.splice(index, 1);

                this.robots.forEach(r => {
                    if (r.connectedTo === robot) r.connectedTo = null;
                });

                if (this.selectedRobot === robot) this.selectedRobot = null;

                this.updateRobotList();
                this.render();
            }

            updateRobotAngle(robot, angle) {
                robot.angle = angle;
                this.render();
            }

            getChainPath(robot) {
                const path = [];
                let current = robot;
                while (current) {
                    path.unshift(current.id);
                    current = current.connectedTo;
                }
                return path.join(' -> ');
            }

            updateRobotList() {
                if (this.robots.length === 0) {
                    this.robotListEl.innerHTML = `
                        <div class="empty-state">
                            <p>No robots added yet</p>
                            <p style="font-size: 0.7rem;">Click the button above to add your first robot</p>
                        </div>
                    `;
                    return;
                }

                const sortedByDepth = [...this.robots].sort((a, b) => a.getDepth() - b.getDepth());

                let html = '';
                sortedByDepth.forEach(robot => {
                    const isSelected  = this.selectedRobot === robot;
                    const isConnected = robot.connectedTo !== null;
                    const depth       = robot.getDepth();
                    const chainPath   = this.getChainPath(robot);

                    let connectionInfo = robot.connectedTo
                        ? `<div class="connection-status">Chain: ${chainPath}</div>`
                        : `<div class="connection-status disconnected">Root robot - drag to move</div>`;

                    html += `
                        <div class="robot-card ${isSelected ? 'selected' : ''} ${isConnected ? 'connected' : ''}" data-id="${robot.id}">
                            <div class="robot-card-header">
                                <div class="robot-info">
                                    <span class="layer-indicator ${isConnected ? 'connected' : 'root'}"></span>
                                    <span class="robot-name">Robot ${robot.id}</span>
                                    <span style="font-size: 0.7rem; color: #555;">(Layer ${depth})</span>
                                </div>
                                <div class="robot-card-actions">
                                    <button class="delete" onclick="simulator.removeRobot(simulator.robots.find(r => r.id === ${robot.id}))" title="Delete">x</button>
                                </div>
                            </div>
                            <div class="robot-card-body">
                                <div class="control-group">
                                    <label>
                                        <span>Motor Angle</span>
                                        <span class="angle-value" id="angle-${robot.id}">${Math.round(robot.angle)}deg</span>
                                    </label>
                                    <div class="slider-container">
                                        <input type="range" id="slider-${robot.id}" min="0" max="360" value="${robot.angle}"
                                            oninput="simulator.updateRobotAngle(simulator.robots.find(r => r.id === ${robot.id}), parseFloat(this.value)); document.getElementById('angle-${robot.id}').textContent = this.value + 'deg'">
                                    </div>
                                </div>
                                ${connectionInfo}
                            </div>
                        </div>
                    `;
                });

                this.robotListEl.innerHTML = html;
            }
        }

        const simulator = new RobotSimulator();
    </script>
</body>
</html>
